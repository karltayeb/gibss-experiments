coal:
  year_start: 1851
  year_end: 1962            # inclusive; 1962 is partial (last event 22 Mar 1962)
  resolutions: [year, month]
  fit:
    L: [1, 3, 5]
    methods: [poisson]       # gibss front-door names; sensitivity adds cf_cavi, irls
    coverage: 0.95
    estimate_prior_variance: true
    fixed_prior_variance: [0.25, 1.0]
    min_log_bf: 2.0          # a component counts as a declared changepoint above this
  exact:
    # Gamma(shape, rate) on segment rates: prior mean = overall mean rate, shape sets
    # how diffuse. p = per-position prior changepoint probability (geometric segment
    # lengths); p = 1/n gives one expected changepoint a priori.
    shape: [0.5, 1.0, 2.0]
    shape_default: 1.0
    p: [0.005, 0.01, 0.02, 0.05, 0.1]
    p_default: 0.02
    kmax: 20
  calibration:
    n_reps: 200
    seed: 20261004

lambda:
  accession: NC_001416.1
  bin_widths: [50, 100, 250, 500, 1000]
  primary_width: 100
  fit:
    L: [5, 10, 20]
    coverage: 0.95
    min_log_bf: 2.0
    fixed_prior_variance: [0.05, 0.25]   # sensitivity at the primary width, largest L
  exact:
    # Beta(a, b) on segment GC fraction; a = b = 1 is uniform. p is the per-bin prior
    # changepoint probability at the primary width; other widths scale p by width ratio
    # so the expected number of changepoints per kb is the same.
    beta_a: 1.0
    beta_b: 1.0
    p_per_100bp: [0.002, 0.005, 0.01, 0.02, 0.05]
    p_default: 0.01
    kmax: 40
  hmm:
    n_states: 2
  calibration:
    n_reps: 40
    fit_L: [5, 10]
    seed: 20261004
  # functional blocks (approximate, from the GenBank CDS table); boundaries in bp
  blocks:
    - {name: head, start: 191, end: 7965}
    - {name: tail, start: 7977, end: 22557}
    - {name: b2 / ea (non-essential), start: 22686, end: 26973}
    - {name: int-xis recombination, start: 27812, end: 29078}
    - {name: ea / exo-bet-gam, start: 29374, end: 33330}
    - {name: cIII-N-rex-cI regulation, start: 33299, end: 37940}
    - {name: cro-cII-O-P replication, start: 38041, end: 40570}
    - {name: Nin region, start: 40644, end: 43889}
    - {name: Q, start: 43886, end: 44509}
    - {name: lysis S-R-Rz, start: 45186, end: 46427}
    - {name: bor / right end, start: 46459, end: 48502}
