# Self-contained uv project for the eQTL negative-binomial fine-mapping experiment. Kept
# ISOLATED from the repo-root env on purpose, like changepoints / cryptic_tb: this analysis
# pins its own gibss-mono rev so a fit is reproducible independently of whatever the shared
# repo .venv tracks. Build / run from this directory:
#
#   cd eqtl
#   uv sync
#   uv run pytest
#   uv run snakemake --cores 4 results/summary/fit.parquet
[project]
name = "eqtl"
version = "0.1.0"
description = "Does a negative binomial SuSiE improve cis-eQTL fine-mapping over the transform-then-linear pipeline?"
requires-python = ">=3.13"
dependencies = [
    "gibss-mono",
    "jax>=0.10.0",
    "numpy>=2.4.4",
    "polars>=1.40.1",
    "scipy>=1.16.0",
    "matplotlib>=3.10.9",
    "pyyaml>=6.0",
    "stdpopsim>=0.3",
    "snakemake>=9.20.0",
    "snakemake-executor-plugin-cluster-generic>=1.0.9",
    "h5py>=3.16.0",
    "anndata>=0.13.4",
]

[tool.uv.sources]
# 9799751 = gibss-mono main (pushed 2026-10-27). It has family="negative_binomial" with the
# null-model plug-in dispersion (1fa286a), the level collapse of 0/1/2 dosage designs in the
# spectral kernel (5292a59, ~2x on nb_cavi), and the poisson_gamma / polya_gamma augmentation
# routes (9799751). This project pins its own rev, independent of the root project's. Keep
# the rev explicit.
gibss-mono = { git = "https://github.com/karltayeb/gibss-mono", rev = "9799751" }

# Standalone project, not a member of any parent uv workspace.
[tool.uv.workspace]
members = []

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eqtl"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "great-tables>=1.0.0",
    "itables>=2.9.1",
    "papermill>=2.7.0",
    "pyarrow>=26.0.0",
    "pandas>=3.0.6",
]
