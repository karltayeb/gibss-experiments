# Self-contained uv project for the CRyPTIC TB drug-resistance example.
# Kept ISOLATED from the repo-root env on purpose, like gsea_examples/lifan: this
# analysis pins its own gibss-mono rev so a fit is reproducible independently of
# whatever the shared repo .venv tracks. Build/run from this directory:
#
#   cd cryptic_tb
#   uv sync
#   uv run python scripts/01_phenotypes.py
[project]
name = "cryptic-tb"
version = "0.1.0"
description = "Logistic SuSiE on CRyPTIC M. tuberculosis drug resistance"
requires-python = ">=3.13"
dependencies = [
    "gibss-mono",
    "jax>=0.10.0",
    "numpy>=2.4.4",
    "polars>=1.40.1",
    "scipy>=1.16.0",
    "matplotlib>=3.10.9",
    "pyyaml>=6.0",
]

[tool.uv.sources]
# 7c7e462 (local main, 2026-10-05) adds fixed covariates as a joint Gaussian nuisance
# factor with the intercept: fit_glm_susie(X, y, covariates=Z). That replaces the offset
# approximation this analysis used before, where the covariate coefficients were fit once
# on their own and then frozen. It is NOT pushed to GitHub yet, so the source is the local
# clone; switch the url back to https://github.com/karltayeb/gibss-mono once the commit is
# on origin/main. Keep the rev explicit either way.
gibss-mono = { git = "file:///Users/ktayeb/py/gibss-mono", rev = "7c7e462" }

# Standalone project, not a member of any parent uv workspace.
[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
