          - {design: gobp_10_500, enrichment: op_b1.93_s80_120, signal: op_scale_2.60, error: gaussian}
          - {design: gobp_10_500, enrichment: null_b0, signal: op_scale_2.60, error: gaussian}
      - name: scale_m100_weak_signal
        alias: scale_m100_weak_signal
        simulations:
          - {design: gobp_10_500, enrichment: op_b1.46_s80_120, signal: op_scale_6.00, error: gaussian}
          - {design: gobp_10_500, enrichment: null_b0, signal: op_scale_6.00, error: gaussian}
      - name: scale_m100_intermediate_enrich
        alias: scale_m100_intermediate_enrich
        simulations:
          - {design: gobp_10_500, enrichment: op_b4.00_s80_120, signal: op_scale_1.55, error: gaussian}
          - {design: gobp_10_500, enrichment: null_b0, signal: op_scale_1.55, error: gaussian}
      - name: scale_m100_intermediate_balanced
        alias: scale_m100_intermediate_balanced
        simulations:
          - {design: gobp_10_500, enrichment: op_b2.15_s80_120, signal: op_scale_2.89, error: gaussian}
          - {design: gobp_10_500, enrichment: null_b0, signal: op_scale_2.89, error: gaussian}
      - name: scale_m100_intermediate_signal
        alias: scale_m100_intermediate_signal
        simulations:
          - {design: gobp_10_500, enrichment: op_b1.71_s80_120, signal: op_scale_6.00, error: gaussian}
          - {design: gobp_10_500, enrichment: null_b0, signal: op_scale_6.00, error: gaussian}
      - name: scale_m100_strong_enrich
        alias: scale_m100_strong_enrich
        simulations:
          - {design: gobp_10_500, enrichment: op_b4.00_s80_120, signal: op_scale_1.77, error: gaussian}
          - {design: gobp_10_500, enrichment: null_b0, signal: op_scale_1.77, error: gaussian}
      - name: scale_m100_strong_balanced
        alias: scale_m100_strong_balanced
        simulations:
