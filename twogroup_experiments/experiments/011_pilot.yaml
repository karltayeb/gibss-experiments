          - {design: gobp_10_500, enrichment: null_b0, signal: op_scale_3.14, error: gaussian}
      - name: scale_m100_strong_signal
        alias: scale_m100_strong_signal
        simulations:
          - {design: gobp_10_500, enrichment: op_b1.91_s80_120, signal: op_scale_6.00, error: gaussian}
          - {design: gobp_10_500, enrichment: null_b0, signal: op_scale_6.00, error: gaussian}
    methods: *op_methods
    default_args: *default_args
    outputs:
      - {name: operating-points, method_filter: *op_methods, analyses: [pip, cs, cs_non_null, logbf]}
