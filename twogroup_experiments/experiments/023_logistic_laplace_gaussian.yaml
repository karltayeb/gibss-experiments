# 023_logistic_laplace_gaussian: the 022 protocol on a small illustrative AR1 GAUSSIAN design (rho=0.9).
# Same five Q2-scored arms (CAVI-Q2 / gIBSS-Q2 / gIBSS-Laplace / global-JJ / score), n=500, p=256,
# b0=-2, L=5, L*=3 at gap in {8, 64} (causal-causal latent corr rho**gap),
# EB prior (cap 100).
#
# Axis: signal T = E[LRT] in {4, 8, 12, 16, 20, 24} at fixed rho. Every column is N(0,1) so
# there is no set-size axis; beta per T from analysis/logistic_laplace_simulations/
# betas_gaussian_n500.json (MC inversion). The dense control for 022's sparse-set findings:
# large beta is where per-row curvature spread strains Laplace, the JJ bound and score. One
# null. GENERATED by generate_analogs.py -- edit that, not this.
_anchors:
  default_args: &default_args {min_log_bf: 2.0, max_cs_size: 10000, max_fdp: 0.5}

supercollections:
  # FULL GRID: 13 cells x 5 arms, 200 reps.
  023-laplace-gaussian:
    replicates_per_batch: 10
    n_batches: 20
    collections:
      - template: {design: {function: gaussian_markov_X, arguments: {n: 500, p: 256, rho: 0.9}}, signal: binary, error: noiseless}
        over:
          enrichment:
              - {label: mc3_T4_g8, function: spaced_index_effect, arguments: {causal_effects: [0.2358, 0.2358, 0.2358], gap: 8}, intercept: -2.0}
              - {label: mc3_T4_g64, function: spaced_index_effect, arguments: {causal_effects: [0.2358, 0.2358, 0.2358], gap: 64}, intercept: -2.0}
              - {label: mc3_T8_g8, function: spaced_index_effect, arguments: {causal_effects: [0.3608, 0.3608, 0.3608], gap: 8}, intercept: -2.0}
              - {label: mc3_T8_g64, function: spaced_index_effect, arguments: {causal_effects: [0.3608, 0.3608, 0.3608], gap: 64}, intercept: -2.0}
              - {label: mc3_T12_g8, function: spaced_index_effect, arguments: {causal_effects: [0.4517, 0.4517, 0.4517], gap: 8}, intercept: -2.0}
              - {label: mc3_T12_g64, function: spaced_index_effect, arguments: {causal_effects: [0.4517, 0.4517, 0.4517], gap: 64}, intercept: -2.0}
              - {label: mc3_T16_g8, function: spaced_index_effect, arguments: {causal_effects: [0.5278, 0.5278, 0.5278], gap: 8}, intercept: -2.0}
              - {label: mc3_T16_g64, function: spaced_index_effect, arguments: {causal_effects: [0.5278, 0.5278, 0.5278], gap: 64}, intercept: -2.0}
              - {label: mc3_T20_g8, function: spaced_index_effect, arguments: {causal_effects: [0.5942, 0.5942, 0.5942], gap: 8}, intercept: -2.0}
              - {label: mc3_T20_g64, function: spaced_index_effect, arguments: {causal_effects: [0.5942, 0.5942, 0.5942], gap: 64}, intercept: -2.0}
              - {label: mc3_T24_g8, function: spaced_index_effect, arguments: {causal_effects: [0.6528, 0.6528, 0.6528], gap: 8}, intercept: -2.0}
              - {label: mc3_T24_g64, function: spaced_index_effect, arguments: {causal_effects: [0.6528, 0.6528, 0.6528], gap: 64}, intercept: -2.0}
              - {label: null, function: uniform_single_effect, arguments: {causal_effect: 0.0}, intercept: -2.0}
    methods: [logistic_q2_L5_cavi, logistic_q2_L5_gibss, logistic_q2_L5_gibss_laplace, logistic_q2_L5_globaljj, logistic_q2_L5_score]
    default_args: *default_args
    outputs:
      - {name: laplace_gaussian, method_filter: [logistic_q2_L5_cavi, logistic_q2_L5_gibss, logistic_q2_L5_gibss_laplace, logistic_q2_L5_globaljj, logistic_q2_L5_score], analyses: [pip, cs]}

