              - {label: null, function: uniform_single_effect, arguments: {causal_effect: 0.0}, intercept: -2.0}
    methods: [logistic_q2_L5_gibss, logistic_q2_L5_gibss_laplace, logistic_q2_L5_globaljj, logistic_q2_L5_score]
    default_args: *default_args
    outputs:
      - {name: laplace_gaussian_nocavi, method_filter: [logistic_q2_L5_gibss, logistic_q2_L5_gibss_laplace, logistic_q2_L5_globaljj, logistic_q2_L5_score], analyses: [pip, cs]}

