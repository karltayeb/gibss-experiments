# 022_logistic_laplace: when is gIBSS-Laplace good enough? Five Q2 logistic-SuSiE arms at
# L=1 and L=10 -- gIBSS-Laplace (order-1 SER, plug-in offset, reduced to Q2), gIBSS-Q2
# (Gaussian-VI SER, plug-in offset), global-JJ (jj_fixed bound), CAVI-Q2 (Gaussian-VI SER,
# exact cf offset fold), score (one Newton step at the null) -- all scored on the exact Q2
# ELBO. Centered, shared Gaussian intercept, EB prior variance (cap 100).
#
# Axis: expected set size m in {5, 10, 30, 100} of a sparse 0/1 design (n=10000, p=256,
# corr=0.8, b0=-2); beta calibrated per m to E[LRT] = T in {4, 8, 16}
# (analysis/logistic_laplace_simulations/calibrate.py -> betas.json). Small m = skewed per-feature
# likelihood (Laplace misses); large m = Bernstein-von Mises (Laplace exact). This file is
# GENERATED by generate_experiment.py -- edit that, not this.
_anchors:
  methods: &methods [logistic_q2_ser_gibss_laplace, logistic_q2_ser_gibss, logistic_q2_ser_globaljj, logistic_q2_ser_cavi, logistic_q2_ser_score, logistic_q2_L10_gibss_laplace, logistic_q2_L10_gibss, logistic_q2_L10_globaljj, logistic_q2_L10_cavi, logistic_q2_L10_score]
  default_args: &default_args {min_log_bf: 2.0, max_cs_size: 10000, max_fdp: 0.5}

