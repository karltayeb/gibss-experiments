              - {label: mc3_m200_T16_g64, function: spaced_index_effect, arguments: {causal_effects: [0.8007, 0.8007, 0.8007], gap: 64}, intercept: -2.0}
              - {label: null_m200, function: uniform_single_effect, arguments: {causal_effect: 0.0}, intercept: -2.0}
    methods: [logistic_q2_L5_gibss_laplace, logistic_q2_L5_gibss, logistic_q2_L5_globaljj, logistic_q2_L5_score]
    default_args: *default_args
