              - {label: mc3_m100_T8_g10, function: spaced_index_effect, arguments: {causal_effects: [0.6961, 0.6961, 0.6961], gap: 10}, intercept: -2.0}
    methods: [logistic_q2_ser_gibss_laplace, logistic_q2_ser_gibss, logistic_q2_ser_globaljj, logistic_q2_ser_cavi, logistic_q2_ser_score, logistic_q2_L10_gibss_laplace, logistic_q2_L10_gibss, logistic_q2_L10_globaljj, logistic_q2_L10_cavi, logistic_q2_L10_score]
    default_args: *default_args
    outputs:
      - {name: pilot, method_filter: [logistic_q2_ser_gibss_laplace, logistic_q2_ser_gibss, logistic_q2_ser_globaljj, logistic_q2_ser_cavi, logistic_q2_ser_score, logistic_q2_L10_gibss_laplace, logistic_q2_L10_gibss, logistic_q2_L10_globaljj, logistic_q2_L10_cavi, logistic_q2_L10_score], analyses: [pip, cs]}

  # pilot control: the mc3 gap-10 cells at corr=0.0, L=10 arms (no CAVI), 20 reps.
  022-laplace-pilot-indep:
    replicates_per_batch: 10
    n_batches: 2
    collections:
      - template: {design: {function: binary_markov_X, arguments: {n: 10000, p: 256, corr: 0.0, density: 0.0005}}, signal: binary, error: noiseless}
        over:
