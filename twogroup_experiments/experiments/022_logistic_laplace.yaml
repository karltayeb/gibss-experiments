    replicates_per_batch: 10
    n_batches: 5
    collections:
      - template: {design: {function: binary_markov_X, arguments: {n: 1000, p: 256, corr: 0.8, density: 0.005}}, signal: binary, error: noiseless}
        over:
          enrichment:
              - {label: mc3_m5_T16_g8, function: spaced_index_effect, arguments: {causal_effects: [3.9336, 3.9336, 3.9336], gap: 8}, intercept: -2.0}
              - {label: mc3_m5_T16_g64, function: spaced_index_effect, arguments: {causal_effects: [3.9336, 3.9336, 3.9336], gap: 64}, intercept: -2.0}
              - {label: null_m5, function: uniform_single_effect, arguments: {causal_effect: 0.0}, intercept: -2.0}
      - template: {design: {function: binary_markov_X, arguments: {n: 1000, p: 256, corr: 0.8, density: 0.01}}, signal: binary, error: noiseless}
        over:
          enrichment:
              - {label: mc3_m10_T16_g8, function: spaced_index_effect, arguments: {causal_effects: [2.5835, 2.5835, 2.5835], gap: 8}, intercept: -2.0}
              - {label: mc3_m10_T16_g64, function: spaced_index_effect, arguments: {causal_effects: [2.5835, 2.5835, 2.5835], gap: 64}, intercept: -2.0}
              - {label: null_m10, function: uniform_single_effect, arguments: {causal_effect: 0.0}, intercept: -2.0}
      - template: {design: {function: binary_markov_X, arguments: {n: 1000, p: 256, corr: 0.8, density: 0.05}}, signal: binary, error: noiseless}
        over:
          enrichment:
              - {label: mc3_m50_T16_g8, function: spaced_index_effect, arguments: {causal_effects: [1.3196, 1.3196, 1.3196], gap: 8}, intercept: -2.0}
              - {label: mc3_m50_T16_g64, function: spaced_index_effect, arguments: {causal_effects: [1.3196, 1.3196, 1.3196], gap: 64}, intercept: -2.0}
              - {label: null_m50, function: uniform_single_effect, arguments: {causal_effect: 0.0}, intercept: -2.0}
      - template: {design: {function: binary_markov_X, arguments: {n: 1000, p: 256, corr: 0.8, density: 0.1}}, signal: binary, error: noiseless}
