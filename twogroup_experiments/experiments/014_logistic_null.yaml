# 014_logistic_null: null logistic simulation - calibration under no enrichment.
#
# z ~ Bernoulli(sigmoid(intercept)) on the GO:BP design with NO causal gene set
# (null_neg{k}, b=0). There is nothing to recover, so this probes false positives:
# PIP calibration and credible-set false-discovery / coverage under the null. The
# base rate P(z=1) = sigmoid(intercept) is swept across three collections
# (neg1/neg2/neg3 = 0.27 / 0.12 / 0.05) to see whether prevalence affects calibration.
#
# Three methods regress the same response (z) on the design, selected via `response: z`:
#   linear_est_lpm       linear SuSiE, residual variance estimated (LPM on z)
#   logistic_z         logistic SuSiE (well-specified)
#   logistic_score_z   logistic score approximation (Taylor-fixed at the null intercept)
#
# signal: binary (f0=delta_0, f1=delta_1) + error: noiseless make thetahat == z, so the
# unused two-group layer is an honest copy of z. The fit reads z regardless.
# See docs/superpowers/specs/2026-07-27-response-transform-design.md.
_anchors:
  null_methods: &null_methods
    [linear_est_lpm__L=1, logistic_z__L=1, logistic_score_z__L=1,
     linear_est_lpm__L=10, logistic_z__L=10, logistic_score_z__L=10]
  default_args: &default_args {min_log_bf: 2.0, max_cs_size: 10000, max_fdp: 0.5}

supercollections:
  014-logistic-null:
    n_batches: 1
    collections:
      - name: neg1
        alias: neg1
        simulations:
          - {design: gobp_10_500, enrichment: null_neg1, signal: binary, error: noiseless}
      - name: neg2
        alias: neg2
        simulations:
          - {design: gobp_10_500, enrichment: null_neg2, signal: binary, error: noiseless}
      - name: neg3
        alias: neg3
        simulations:
          - {design: gobp_10_500, enrichment: null_neg3, signal: binary, error: noiseless}
      - name: neg4
        alias: neg4
        simulations:
          - {design: gobp_10_500, enrichment: null_neg4, signal: binary, error: noiseless}
    methods: *null_methods
    default_args: *default_args
    outputs:
      - {name: logistic_null, method_filter: *null_methods, analyses: [pip, cs]}
